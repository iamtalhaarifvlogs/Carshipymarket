<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Metallic gradient for the inner card -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="35%" stop-color="#6b7280" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    
    <!-- Inner gradient for the metallic frame border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Glossy reflection overlay -->
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Canvas background matches card background -->
  <rect width="240" height="240" fill="#1a1c1e" />

  <!-- Outer Dark Charcoal Grey Rounded Square -->
  <rect x="20" y="20" width="200" height="200" rx="28" fill="#2d3135" />

  <!-- Inner Metallic Card / Screen -->
  <rect x="36" y="46" width="168" height="136" rx="36" fill="url(#metalGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Reflection Glare (covers top half of the screen) -->
  <path d="M38 82 C38 60, 52 48, 80 48 L160 48 C188 48, 202 60, 202 82 L202 110 L38 110 Z" fill="url(#glareGrad)" />

  <!-- Landscape elements: Mountain path (darker silver grey) -->
  <path d="M 54 148 C 65 110, 85 92, 104 112 C 122 130, 142 120, 158 134 C 170 144, 180 148, 186 148 L 186 156 L 54 156 Z" fill="#9ca3af" opacity="0.85" />

  <!-- Landscape elements: Sun -->
  <circle cx="152" cy="88" r="14" fill="#9ca3af" opacity="0.85" />
</svg>
